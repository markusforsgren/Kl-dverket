<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betalning genomförd — Klädverket</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0D0D0D;color:#fff;font-family:'Barlow',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.card{max-width:520px;width:100%;text-align:center;border:1px solid #2a2a2a;padding:3rem 2.5rem;background:#141414}
.icon{font-size:3.5rem;margin-bottom:1.25rem}
h1{font-family:'Barlow Condensed',sans-serif;font-size:2.5rem;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:#C8A84B;margin-bottom:.75rem}
p{color:#888;font-size:.95rem;line-height:1.75;margin-bottom:.5rem}
p strong{color:#ccc}
.back{display:inline-block;margin-top:2rem;background:#C8A84B;color:#0D0D0D;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:.95rem;letter-spacing:.1em;text-transform:uppercase;padding:.75rem 2rem;text-decoration:none;transition:background .2s}
.back:hover{background:#E2C46A}
</style>
</head>
<body>
<div class="card">
  <div class="icon">✓</div>
  <h1>Betalning genomförd!</h1>
  <p>Tack för din beställning! Vi skickar ett <strong>digitalt korrektur</strong> till din e-post inom 24 timmar.</p>
  <p>Godkänner du korrekturen startar vi tryckningen direkt.</p>
  <p style="margin-top:1rem;font-size:.82rem;color:#555">Frågor? <a href="mailto:info@klädverket.se" style="color:#C8A84B">info@klädverket.se</a></p>
  <a class="back" href="/">Tillbaka till startsidan</a>
</div>
</body>
</html>
